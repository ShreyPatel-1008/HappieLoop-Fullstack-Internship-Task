<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View your order history at ShopVerse. Track all your past orders.">
  <title>Order History — ShopVerse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">🛒</span>
        <span>ShopVerse</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/products.html" class="nav-link">Products</a></li>
        <li><a href="/cart.html" class="nav-link cart-link">Cart <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li><a href="/orders.html" class="nav-link active">Orders</a></li>
      </ul>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Order History</h1>
    <p>Track all your past orders</p>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-spinner" id="loadingSpinner">
    <div class="spinner"></div>
    <p>Loading orders...</p>
  </div>

  <!-- Orders Content -->
  <div class="orders-container">
    <div id="ordersContent"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-logo">🛒 ShopVerse</div>
      <p>Your premium destination for quality products.</p>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
        <a href="/cart.html">Cart</a>
        <a href="/orders.html">Orders</a>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon">✓</span>
    <span id="toastMessage"></span>
  </div>

  <script src="js/orders.js"></script>
</body>
</html>
