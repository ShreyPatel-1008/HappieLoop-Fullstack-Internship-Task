<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all products at ShopVerse — Electronics, Clothing, and Books at the best prices.">
  <title>Products — ShopVerse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">🛒</span>
        <span>ShopVerse</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/products.html" class="nav-link active">Products</a></li>
        <li><a href="/cart.html" class="nav-link cart-link">Cart <span class="cart-badge" id="cartBadge">0</span></a></li>
        <li><a href="/orders.html" class="nav-link">Orders</a></li>
      </ul>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <h1>All Products</h1>
    <p>Explore our complete collection</p>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar container" id="filterBar">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search products...">
    </div>
    <select class="filter-select" id="categoryFilter">
      <option value="all">All Categories</option>
    </select>
    <div class="price-inputs">
      <input type="number" id="minPrice" placeholder="Min ₹">
      <span>to</span>
      <input type="number" id="maxPrice" placeholder="Max ₹">
    </div>
    <button class="btn btn-primary btn-sm" id="applyFilters">Apply</button>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-spinner" id="loadingSpinner">
    <div class="spinner"></div>
    <p>Loading products...</p>
  </div>

  <!-- Products Grid -->
  <section class="section" style="padding-top: 0;">
    <div class="products-grid container" id="productsGrid"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-logo">🛒 ShopVerse</div>
      <p>Your premium destination for quality products.</p>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
        <a href="/cart.html">Cart</a>
        <a href="/orders.html">Orders</a>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon">✓</span>
    <span id="toastMessage"></span>
  </div>

  <script src="js/products.js"></script>
</body>
</html>
